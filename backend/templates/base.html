<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inversiones de agua y saneamiento - UNAS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <style>
        body { font-family: 'Inter', sans-serif; overflow: hidden; }
        #map { height: calc(100vh - 80px); width: 100vw; z-index: 10; }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .floating-panel {
            background: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid #e5e7eb;
            z-index: 20;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-50 text-gray-800">
    <!-- Header matching screenshot -->
    <header class="bg-white border-b border-gray-200 h-20 flex flex-col justify-center px-6 z-30 relative shadow-sm">
        <div class="flex justify-between items-end">
            <div>
                <div class="text-xs font-semibold text-blue-600 tracking-wider mb-1">UNAS · PLATAFORMA TERRITORIAL</div>
                <h1 class="text-2xl font-bold text-gray-900 leading-none">Inversiones de agua y saneamiento</h1>
            </div>
            
            <div class="w-64">
                <label for="department-select" class="block text-xs font-medium text-gray-500 mb-1">Departamento</label>
                <select id="department-select" class="w-full bg-white border border-gray-300 text-gray-700 text-sm rounded focus:ring-blue-500 focus:border-blue-500 p-2">
                    <option value="">Seleccione Departamento</option>
                </select>
            </div>
        </div>
    </header>

    <main class="relative w-full h-full">
        {% block content %}{% endblock %}
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script>
        // Funciones utilitarias globales
        function formatMoney(amount) {
            if (!amount) return 'S/ 0.00';
            const val = parseFloat(amount);
            if (val >= 1000000) {
                return `S/ ${(val / 1000000).toFixed(2)} M`;
            }
            if (val >= 1000) {
                return `S/ ${(val / 1000).toFixed(2)} mil`;
            }
            return `S/ ${val.toFixed(2)}`;
        }
        
        function formatNumber(num) {
            return num ? parseInt(num).toLocaleString() : '0';
        }
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
